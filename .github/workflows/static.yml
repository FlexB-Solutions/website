# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install build dependencies
        run: npm ci
      - name: Compile JSX components
        run: npm run build
      - name: Prepare production files
        run: |
          mkdir -p public
          cp index.html impressum.html datenschutz.html 404.html robots.txt sitemap.xml favicon.ico apple-touch-icon.png public/
          cp -R assets automatisierung-markt leistungen uploads ui_kits public/
          # JSX-Quellen gehoeren nicht ins Deployment, nur die kompilierten .js
          rm -f public/assets/site/*.jsx
          # Nicht verlinkte Arbeitsdatei nicht veroeffentlichen
          rm -f public/uploads/SmartHeating_NodeRED_Standalone_BasicFlow.json
          # Altbestände ohne geklärte Bildrechte gehören nicht in die Live-Seite.
          rm -rf public/uploads/stock
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
