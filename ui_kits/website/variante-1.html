<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlexB Solutions – Automatisierung & Prozessoptimierung</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; }
  body { font-family: 'Outfit', system-ui, sans-serif; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; width: 100%; max-width: 100%; }
  #root { width: 100%; max-width: 100%; overflow-x: hidden; }
  button, a { -webkit-tap-highlight-color: transparent; }
  img { max-width: 100%; }

  .reveal-base {
    opacity: 0;
    transform: translate3d(var(--reveal-x, 0), var(--reveal-y, 0), 0) scale(var(--reveal-scale, 1));
    transition:
      opacity 0.98s cubic-bezier(0.22, 1, 0.36, 1),
      transform 0.98s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: opacity, transform;
  }
  .reveal-base.is-visible {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1);
  }
  .reveal-delay-1 { transition-delay: 0.12s; }
  .reveal-delay-2 { transition-delay: 0.2s; }
  .reveal-delay-3 { transition-delay: 0.28s; }
  .reveal-delay-4 { transition-delay: 0.36s; }

  [data-reveal-side="left"] { --reveal-x: -108px; }
  [data-reveal-side="right"] { --reveal-x: 108px; }
  [data-reveal-side="bottom"] { --reveal-y: 72px; }
  [data-reveal-side="zoom"] { --reveal-scale: 0.76; }

  @media (prefers-reduced-motion: reduce) {
    .reveal-base,
    .reveal-base.is-visible {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }
  }

  .site-nav__links { display: flex; align-items: center; gap: 28px; }
  .site-nav__tagline { display: block; }

  .hero-section {
    padding: 0 24px;
    min-height: min(820px, 86vh);
    display: flex;
    align-items: center;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }
  .hero-section:before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    opacity: 1;
    transform: scale(1.02);
    filter: saturate(0.98);
  }
  .hero-section:after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 33% 50%, rgba(246,245,240,0.92) 0%, rgba(246,245,240,0.74) 31%, rgba(246,245,240,0.26) 54%, rgba(246,245,240,0) 76%),
      linear-gradient(90deg, rgba(246,245,240,0.72) 0%, rgba(246,245,240,0.28) 43%, rgba(246,245,240,0) 72%);
    pointer-events: none;
  }
  .hero-inner { width: 100%; max-width: 1180px; margin: 0 auto; text-align: left; position: relative; z-index: 1; display: flex; justify-content: flex-start; align-items: center; padding: clamp(104px, 13vh, 144px) 0 clamp(68px, 9vh, 108px); }
  @media (min-width: 1140px) {
    .hero-inner { justify-content: space-between; gap: 48px; }
  }
  .hero-content-panel {
    max-width: 780px;
    padding: 0;
    text-shadow: none;
  }
  .hero-logo {
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    gap: 0;
    margin-bottom: 28px;
    font-size: clamp(42px, 6vw, 78px);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    animation: logoLift 4.8s ease-in-out infinite;
  }
  .hero-logo span { color: var(--brand); }
  .hero-logo-lockup { display: inline-flex; align-items: center; justify-content: flex-start; gap: clamp(14px, 2vw, 22px); margin-bottom: 28px; }
  .hero-logo-lockup .hero-logo { margin-bottom: 0; }
  .hero-logo-divider { width: 1px; height: clamp(42px, 5.2vw, 68px); background: var(--brand-light); }
  .hero-logo-sub { text-align: left; color: var(--ink); line-height: 1.2; }
  .hero-logo-sub strong { display: block; font-size: clamp(15px, 1.55vw, 22px); letter-spacing: 0.24em; font-weight: 900; }
  .hero-logo-sub span { display: block; margin-top: 6px; color: var(--brand-ink); font-size: clamp(13px, 1.25vw, 17px); font-weight: 500; letter-spacing: 0; }
  @keyframes logoLift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .hero-title {
    font-size: clamp(42px, 5.1vw, 74px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 24px;
    max-width: 760px;
    margin-left: 0;
    margin-right: 0;
  }
  .hero-lead {
    font-size: clamp(18px, 1.55vw, 24px);
    color: #111827;
    line-height: 1.55;
    margin-bottom: 36px;
    max-width: 690px;
    margin-left: 0;
    margin-right: 0;
    font-weight: 650;
    text-shadow: none;
  }
  .hero-section .hero-ctas { justify-content: flex-start; }
  .hero-section .hero-trust { justify-content: flex-start; }
  .hero-section .hero-trust > div {
    color: #111827 !important;
    font-weight: 750;
    text-shadow: none;
  }

  /* --- Hero: Nutzen-Grafik, stufenweise beim Scrollen ------------------- */
  .hero-proof { display: none; }
  @media (min-width: 1140px) { .hero-proof { display: block; flex: 0 0 380px; } }
  .hero-proof svg { width: 100%; height: auto; display: block; overflow: visible; }

  .proof-label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; fill: var(--brand); font-family: inherit; }
  .proof-note { font-size: 11px; fill: var(--muted); font-family: inherit; }

  /* Nur Deckkraft und ein kleiner Versatz - die Y-Position steckt in den Koordinaten */
  .proof-row { opacity: var(--stage, 0); transform: translateY(calc((1 - var(--stage, 0)) * 12px)); }
  .proof-row--1 { --stage: var(--s1, 0); }
  .proof-row--2 { --stage: var(--s2, 0); }
  .proof-row--3 { --stage: var(--s3, 0); }

  .proof-bar-before { fill: var(--brand-tint); }
  .proof-bar-after { fill: var(--brand); transform: scaleX(calc(0.04 + var(--s1, 0) * 0.38)); transform-origin: 70px 0; }

  .proof-dot { fill: var(--brand-tint); }
  .proof-dot--fehler {
    fill: #c2603f;
    opacity: calc(1 - var(--s2, 0));
    transform: scale(calc(1 - var(--s2, 0) * 0.65));
    transform-box: fill-box;
    transform-origin: center;
  }

  .proof-axis { stroke: var(--brand-border); stroke-width: 1; }
  .proof-line { stroke: var(--brand); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: var(--dash, 1); }
  .proof-area { fill: var(--brand); opacity: calc(var(--s3, 0) * 0.10); }
  .proof-tip { fill: var(--brand); opacity: calc(max(0, var(--s3, 0) - 0.82) * 5.5); }

  /* Der zugehoerige Textteil links wird kurz dick und dunkelgruen und wieder normal */
  .hero-emph {
    display: inline-block;
    font-weight: calc(400 + var(--puls, 0) * 400);
    color: color-mix(in oklab, var(--brand-dark) calc(var(--puls, 0) * 100%), currentColor);
    transform: scale(calc(1 + var(--puls, 0) * 0.09));
  }
  .hero-emph--1 { --puls: var(--p1, 0); }
  .hero-emph--2 { --puls: var(--p2, 0); }
  .hero-emph--3 { --puls: var(--p3, 0); }

  @media (prefers-reduced-motion: reduce) {
    .hero-section { min-height: min(820px, 86vh) !important; }
    .hero-inner { position: static !important; }
    .hero-emph { font-weight: 400; color: currentColor; transform: none; }
  }

  /* --- Leistungen: drei Saeulen ------------------------------------------ */
  .pillars-section { padding: 96px 24px; background: #fff; }
  .pillars-inner { max-width: 1180px; margin: 0 auto; }
  .pillars-header { margin-bottom: 56px; }
  .pillars-h2 { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 14px; }
  .pillars-sub { font-size: 17px; color: var(--muted); line-height: 1.65; max-width: 620px; }
  .pillars-stack { display: grid; gap: 64px; }

  .pillar { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: clamp(28px, 4vw, 60px); align-items: start; }
  .pillar--reverse { grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); }
  .pillar--reverse .pillar-media { order: 2; }

  .pillar-media { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 4px; background: var(--brand-tint); }
  .pillar-media img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .pillar-meta { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; }
  .pillar-num { font-size: 12px; color: #7a8d7d; font-variant-numeric: tabular-nums; }
  .pillar-kicker { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand); }
  .pillar-title { font-size: clamp(28px, 3.2vw, 40px); line-height: 1.1; font-weight: 600; letter-spacing: -0.035em; color: var(--ink); margin-bottom: 14px; }
  .pillar-lead { font-size: 16px; line-height: 1.7; color: var(--muted); max-width: 560px; margin-bottom: 28px; }

  .pillar-services { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--brand-border); }
  .pillar-service { border-bottom: 1px solid var(--brand-border); }
  .pillar-service > a,
  .pillar-service > div {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 4px 18px;
    padding: 16px 4px;
    text-decoration: none;
    color: inherit;
  }
  .pillar-service__title { font-size: 16px; font-weight: 600; color: var(--ink); }
  .pillar-service__desc { grid-column: 1 / -1; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .pillar-service__arrow { grid-row: 1; grid-column: 2; font-size: 15px; color: var(--brand); transition: transform 0.18s ease; }
  .pillar-service > a { transition: background-color 0.18s ease, padding-left 0.18s ease; }
  .pillar-service > a:hover,
  .pillar-service > a:focus-visible { background: var(--brand-tint); padding-left: 12px; }
  .pillar-service > a:hover .pillar-service__title,
  .pillar-service > a:focus-visible .pillar-service__title { color: var(--brand); }
  .pillar-service > a:hover .pillar-service__arrow { transform: translate(3px, -3px); }

  .pillar-cta {
    margin-top: 26px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.18s ease;
  }
  .pillar-cta:hover, .pillar-cta:focus-visible { background: #135e39; }

  @media (max-width: 860px) {
    .pillar, .pillar--reverse { grid-template-columns: 1fr; gap: 24px; }
    .pillar--reverse .pillar-media { order: 0; }
    .pillar-media { aspect-ratio: 16 / 9; }
    .pillars-stack { gap: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pillar-service > a, .pillar-service__arrow { transition: none; }
    .pillar-service > a:hover, .pillar-service > a:focus-visible { padding-left: 4px; }
    .pillar-service > a:hover .pillar-service__arrow { transform: none; }
  }

  .market-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 24px;
    background: var(--brand);
    color: #fff;
    border-radius: 8px;
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 12px 30px rgba(24,115,68,0.22);
    transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
  }
  a.market-cta:hover,
  a.market-cta:focus-visible {
    background: #1d9159;
    box-shadow: 0 18px 40px rgba(24,115,68,0.38);
    transform: translateY(-2px);
  }
  a.market-cta:focus-visible { outline: 2px solid var(--brand-light); outline-offset: 3px; }
  a.market-cta:active { transform: translateY(0); box-shadow: 0 8px 20px rgba(24,115,68,0.28); }
  @media (prefers-reduced-motion: reduce) {
    .market-cta { transition: none; }
    a.market-cta:hover, a.market-cta:focus-visible { transform: none; }
  }

  .company-section { padding: 104px 24px; background: #fff; }
  .company-inner { max-width: 1180px; margin: 0 auto; }
  .company-header { max-width: 760px; margin: 0 auto 42px; text-align: center; }
  .company-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand); margin-bottom: 12px; }
  .company-title { font-size: clamp(34px, 4vw, 56px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; color: var(--ink); margin-bottom: 16px; }
  .company-sub { font-size: 18px; line-height: 1.6; color: var(--muted); max-width: 680px; margin: 0 auto; }
  .company-layout { display: block; }
  .company-map {
    border: 1px solid var(--brand-border);
    border-radius: 22px;
    background:
      linear-gradient(135deg, rgba(220,252,231,0.84), rgba(255,255,255,0.96) 48%, rgba(246,245,240,0.92)),
      radial-gradient(circle at 14% 18%, rgba(24,115,68,0.14), transparent 28%);
    padding: 26px;
    box-shadow: 0 18px 46px rgba(24,62,46,0.08);
    overflow: hidden;
  }
  .company-map__top { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
  .company-map__label { font-size: 13px; font-weight: 800; color: var(--brand-ink); letter-spacing: 0.08em; text-transform: uppercase; }
  .company-map__hint { font-size: 13px; color: #4b5563; }
  .company-image-stage {
    position: relative;
    container-type: inline-size;
    line-height: 0;
    overflow: hidden;
    border-radius: 18px;
    background: var(--paper);
    border: 1px solid var(--brand-border);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7);
  }
  .company-base-image {
    display: block;
    width: 100%;
    height: auto;
    /* reserviert die exakte Bildbox schon vor dem Laden, damit die
       Prozent-Koordinaten der Hotspots nie gegen eine 0-hohe Buehne rechnen */
    aspect-ratio: 1280 / 853;
  }
  .company-hotspot {
    position: absolute;
    /* cqw = Prozent der Buehnenbreite, skaliert also mit dem Bild statt mit dem Viewport */
    --hotspot-size: clamp(26px, 4.9cqw, 58px);
    width: var(--hotspot-size);
    height: var(--hotspot-size);
    /* Zentrierung ueber margin statt transform: ueberlebt jedes transform-Override */
    margin-left: calc(var(--hotspot-size) / -2);
    margin-top: calc(var(--hotspot-size) / -2);
    border: 2px solid #fff;
    border-radius: 50%;
    background: rgba(24,62,46,0.92);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: clamp(13px, 2.2cqw, 26px);
    font-weight: 900;
    box-shadow: 0 0 0 4px rgba(24,115,68,0.24), 0 14px 32px rgba(13,13,13,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
  }
  .company-hotspot span { transform: translateY(-1px); }
  .company-hotspot:hover,
  .company-hotspot.is-active,
  .company-hotspot:focus-visible {
    transform: scale(1.12);
    background: var(--brand);
    box-shadow: 0 0 0 7px rgba(24,115,68,0.28), 0 18px 40px rgba(13,13,13,0.22);
    outline: none;
  }
  .company-building {
    position: relative;
    min-height: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .company-building:before {
    content: "";
    position: absolute;
    width: min(94%, 820px);
    height: 470px;
    border-radius: 34px;
    background: linear-gradient(135deg, rgba(24,62,46,0.10), rgba(24,115,68,0.05));
    transform: skewY(-7deg) translateY(22px);
    box-shadow: 0 42px 70px rgba(24,62,46,0.14);
  }
  .company-floor {
    position: relative;
    width: min(820px, 96vw);
    height: 500px;
  }
  .company-room {
    border: 0;
    border-radius: 18px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    padding: 18px;
    outline: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
    font-family: inherit;
    transition: transform 0.2s;
    position: absolute;
    overflow: visible;
  }
  .company-room:before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid var(--brand-border);
    border-radius: 18px;
    background: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(220,252,231,0.72));
    transform: skewY(-7deg);
    box-shadow: 12px 16px 0 rgba(24,62,46,0.10), 0 18px 36px rgba(24,62,46,0.08);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, background 0.2s;
  }
  .company-room:after {
    content: "";
    position: absolute;
    inset: auto 14px 14px auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--brand-tint);
    opacity: 0.8;
  }
  .company-room:hover,
  .company-room.is-active {
    transform: translateY(-6px);
  }
  .company-room:hover:before,
  .company-room.is-active:before {
    border-color: var(--brand);
    background: #fff;
    box-shadow: 18px 24px 0 rgba(24,62,46,0.10), 0 26px 44px rgba(24,115,68,0.18);
  }
  .company-room:focus-visible { box-shadow: 0 0 0 3px rgba(24,115,68,0.22), 0 16px 36px rgba(24,115,68,0.16); }
  .company-room__content {
    position: relative;
    z-index: 1;
    width: 100%;
  }
  .company-room__icon { width: 42px; height: 42px; border-radius: 12px; background: var(--brand-tint); color: var(--brand-ink); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .company-room__name { display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .company-room__desc { display: block; font-size: 13px; line-height: 1.45; color: #4b5563; margin-top: 6px; max-width: 180px; }
  .company-detail__media { background: var(--brand-tint); padding: 18px; border-bottom: 1px solid var(--brand-border); }
  .company-detail__image {
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: contain;
    display: block;
    border-radius: 12px;
    background: #fff;
    border: 1px solid var(--brand-tint);
  }
  .company-detail__body { padding: 24px; display: flex; flex-direction: column; gap: 18px; background: #fff; border-radius: 0 0 18px 18px; }
  .company-detail__kicker { color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .company-detail__title { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 800; color: var(--ink); }
  .company-detail__copy { font-size: 15px; line-height: 1.65; color: var(--muted); }
  .company-steps { display: grid; gap: 10px; }
  .company-step { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .company-step__number { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; font-size: 12px; font-weight: 800; }
  .company-detail__button {
    align-self: flex-start;
    border: 1.5px solid var(--brand);
    background: var(--brand);
    color: #fff;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .company-lightbox { position: fixed; inset: 0; z-index: 10000; background: rgba(13,13,13,0.82); display: flex; align-items: center; justify-content: center; padding: 28px; }
  .company-lightbox__inner { position: relative; width: min(920px, 88vw); animation: roomZoom 0.24s ease-out; }
  .company-lightbox__image { width: 100%; max-height: 68vh; object-fit: contain; border-radius: 14px; background: #fff; box-shadow: 0 24px 72px rgba(0,0,0,0.42); }
  .company-lightbox__close { position: absolute; right: 0; top: -48px; width: 38px; height: 38px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.12); color: #fff; cursor: pointer; }
  .company-lightbox__arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.12);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    line-height: 1;
